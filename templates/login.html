<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Medicare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/minimal-medical.css') }}" rel="stylesheet">
    <style>
        .login-section {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding-top: 120px; 
            padding-bottom: 80px;  
        }
        .login-form-container {
            max-width: 450px;
            width: 100%;
            padding: 40px;
            text-align: center;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid #eef2f5;
        }
        .login-form-container h1 {
            font-size: 2.2rem;
            margin-bottom: 25px;
            color: var(--text-color);
            font-weight: 700;
        }
        .form-group input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            color: #212529;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
            background: #ffffff;
        }
        .form-group input::placeholder {
            color: #6c757d;
        }
        .login-button {
            display: inline-block;
            width: 100%;
            padding: 16px;
            background: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .login-button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }
        .register-link {
            margin-top: 25px;
            color: #6c757d;
        }
        .register-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
        .flash-message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            color: #842029;
            background: #f8d7da;
            border: 1px solid #f5c2c7;
            font-weight: 500;
        }
    </style>
</head>
<body>


    <header>
        <nav>
            <a href="{{ url_for('login') }}" class="logo">
                <svg class="logo-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="30" r="8" fill="#0d6efd"/>
                    <circle cx="30" cy="60" r="6" fill="#0d6efd"/>
                    <circle cx="70" cy="65" r="7" fill="#0d6efd"/>
                    <line x1="50" y1="30" x2="30" y2="60" stroke="#0d6efd" stroke-width="2"/>
                    <line x1="50" y1="30" x2="70" y2="65" stroke="#0d6efd" stroke-width="2"/>
                    <line x1="30" y1="60" x2="70" y2="65" stroke="#0d6efd" stroke-width="2"/>
                </svg>
                Medicare
            </a>
            <ul class="nav-links">
                <li><a href="{{ url_for('register') }}">Register</a></li>
            </ul>
            <div class="mobile-menu-toggle">
                <div class="hamburger-line"></div><div class="hamburger-line"></div><div class="hamburger-line"></div>
            </div>
        </nav>
        <div class="mobile-nav">
            <a href="{{ url_for('register') }}">Register</a>
        </div>
    </header>

    <section class="login-section" id="login">
        <div class="login-form-container">
            <h1>Welcome Back</h1>
            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <input type="text" id="username" name="username" placeholder="Username" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" name="password" placeholder="Password" required>
                </div>
                <button type="submit" class="login-button">Login</button>
            </form>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="flash-message">
                        {{ messages[0] }}
                    </div>
                {% endif %}
            {% endwith %}

            <p class="register-link">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
        </div>
    </section>

    <footer>
        <div class="footer-content">
            <div class="footer-copyright">
                <p>&copy; 2025 Medicare Project. All Rights Reserved.</p>
            </div>
            <div class="footer-design">
                Minimal Medical Design
            </div>
        </div>
    </footer>


</body>
</html>
